
<!DOCTYPE html>
<html>

<head>

    <title>Children's Section - Virtual Library</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f6f0e4;
            color: #3b2922;
        }

        header {
            background-color: #3b2922;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 10px 0;
            font-size: 36px;
        }

        header p {
            font-size: 17px;
        }

        .home-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            background-color: #8b6847;
            padding: 9px 18px;
            border-radius: 6px;
        }

        .home-btn:hover {
            background-color: #6d4c35;
        }

        .welcome {
            text-align: center;
            padding: 35px 20px 15px;
        }

        .welcome h2 {
            font-size: 28px;
        }

        .welcome p {
            font-size: 17px;
        }

        .category-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
        }

        .category {
            background-color: white;
            color: #3b2922;
            border: none;
            padding: 20px;
            width: 170px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-4px);
            background-color: #fffaf0;
        }

        .category h2 {
            font-size: 35px;
            margin: 5px;
        }

        .category h3 {
            margin: 10px 0 0;
        }

        #message {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }

        #childrenBooks {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }

        .children-book-card {
            width: 190px;
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .children-book-card img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
        }

        .children-book-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }

        .children-book-card p {
            font-size: 14px;
            color: #555;
        }

        .read-btn {
            background-color: #8b6847;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .read-btn:hover {
            background-color: #6d4c35;
        }

        footer {
            background-color: #3b2922;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        footer p {
            margin: 5px;
        }

    </style>

</head>


<body>


    <header>

        <a href="index.html" class="home-btn">
            🏠 Home
        </a>

        <h1>🧸 Children's Section</h1>

        <p>Fun Stories • Adventures • Imagination</p>

    </header>


    <div class="welcome">

        <h2>📚 Welcome, Little Readers!</h2>

        <p>
            Choose a category and explore some wonderful books.
        </p>

    </div>


    <div class="category-container">

        <button class="category"
            onclick="loadChildrenBooks('fairy tales')">

            <h2>🧚</h2>
            <h3>Fairy Tales</h3>

        </button>


        <button class="category"
            onclick="loadChildrenBooks('animal stories')">

            <h2>🐻</h2>
            <h3>Animal Stories</h3>

        </button>


        <button class="category"
            onclick="loadChildrenBooks('adventure')">

            <h2>🚀</h2>
            <h3>Adventure</h3>

        </button>


        <button class="category"
            onclick="loadChildrenBooks('fantasy')">

            <h2>🧙</h2>
            <h3>Fantasy</h3>

        </button>

    </div>


    <p id="message">
        Choose a category above 👆
    </p>


    <div id="childrenBooks"></div>


    <footer>

        <p>📚 Virtual Library © 2026</p>

        <p>Read • Learn • Imagine</p>

    </footer>


    <script>

        const container =
            document.getElementById("childrenBooks");

        const message =
            document.getElementById("message");


        async function loadChildrenBooks(category) {

            message.textContent = "📚 Loading books...";

            container.innerHTML = "";


            try {

                const response = await fetch(
                    "https://gutendex.com/books/?search=" +
                    encodeURIComponent(category)
                );


                if (!response.ok) {

                    throw new Error("API Error");

                }


                const data = await response.json();


                const books =
                    data.results.slice(0, 12);


                if (books.length === 0) {

                    message.textContent =
                        "📚 Is category mein books nahi mili.";

                    return;

                }


                message.textContent =
                    books.length + " books found";


                books.forEach(function(book) {


                    const card =
                        document.createElement("div");

                    card.className =
                        "children-book-card";


                    const cover =
                        book.formats["image/jpeg"];


                    const htmlUrl =
                        book.formats["text/html"] ||
                        book.formats[
                            "text/html; charset=utf-8"
                        ];


                    card.innerHTML = `

                        <img
                            src="${
                                cover ||
                                'https://placehold.co/150x220?text=No+Cover'
                            }"
                            alt="${book.title}"
                        >

                        <h3>${book.title}</h3>

                        <p>
                            ${
                                book.authors.length
                                ? book.authors[0].name
                                : "Unknown Author"
                            }
                        </p>

                    `;


                    if (htmlUrl) {

                        const button =
                            document.createElement("button");

                        button.textContent =
                            "📖 Read Online";

                        button.className =
                            "read-btn";


                        button.onclick = function() {

                            window.open(
                                htmlUrl,
                                "_blank"
                            );

                        };


                        card.appendChild(button);

                    }


                    container.appendChild(card);

                });


            } catch (error) {

                console.log(error);

                message.textContent =
                    "⚠️ Books load nahi ho paayi. Internet check karo.";

            }

        }

    </script>


</body>

</html>
