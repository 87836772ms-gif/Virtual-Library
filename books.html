<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virtual Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f6f0e4;
      color: #3b2922;
    }

    /* HEADER */

    header {
      background: #3b2922;
      color: #fffaf0;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin-top: 10px;
      font-size: 17px;
      color: #e8d8b8;
    }

    /* SEARCH */

    .search-box {
      text-align: center;
      padding: 30px 15px 15px;
    }

    .search-box input {
      width: 60%;
      max-width: 450px;
      padding: 14px;
      border: 1px solid #c7a96b;
      border-radius: 6px;
      font-size: 16px;
      background: #fffdf8;
      color: #3b2922;
      outline: none;
    }

    .search-box button {
      padding: 14px 22px;
      margin-left: 6px;
      border: none;
      border-radius: 6px;
      background: #8b6847;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .search-box button:hover {
      background: #6d4c35;
    }

    /* CATEGORIES */

    .category-title {
      text-align: center;
      margin: 20px 0 10px;
      font-size: 25px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px 25px 25px;
    }

    .categories button {
      padding: 10px 16px;
      border: 1px solid #c7a96b;
      border-radius: 20px;
      background: #fffdf8;
      color: #5a4030;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 14px;
    }

    .categories button:hover {
      background: #c7a96b;
      color: white;
    }

    /* MESSAGE */

    #message {
      text-align: center;
      font-size: 17px;
      margin: 15px;
      color: #6d5545;
    }

    /* BOOKS */

    #bookContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 25px;
      padding: 20px 35px 40px;
      max-width: 1300px;
      margin: auto;
    }

    .book-card {
      background: #fffdf8;
      border: 1px solid #e0cfad;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(59, 41, 34, 0.12);
      transition: transform 0.2s;
    }

    .book-card:hover {
      transform: translateY(-5px);
    }

    .book-card img {
      width: 145px;
      height: 210px;
      object-fit: cover;
      background: #eee5d4;
      border-radius: 4px;
    }

    .book-card h3 {
      font-size: 18px;
      margin: 15px 0 8px;
      color: #3b2922;
    }

    .book-card p {
      color: #765e4c;
      font-size: 14px;
    }

    .read-btn {
      margin-top: 10px;
      padding: 10px 17px;
      border: none;
      border-radius: 5px;
      background: #8b6847;
      color: white;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .read-btn:hover {
      background: #6d4c35;
    }

    /* READER */

    #reader {
      display: none;
      position: fixed;
      inset: 0;
      background: #f6f0e4;
      z-index: 1000;
      flex-direction: column;
    }

    .reader-header {
      background: #3b2922;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .reader-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .reader-header button {
      background: #c7a96b;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .reader-header button:hover {
      background: #a4864f;
    }

    #reader iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: white;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header h1 {
        font-size: 30px;
      }

      .search-box input {
        width: 80%;
        margin-bottom: 10px;
      }

      .search-box button {
        margin-left: 0;
      }

      #bookContainer {
        padding: 15px;
      }

    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <header>
    <a href="index.html" class="home-btn">🏠 Home</a>

    <h1>📚 Virtual Library</h1>

    <p>
      Discover classic books and read them online
    </p>

  </header>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search for a book..."
    >

    <button onclick="searchBooks()">
      Search
    </button>

  </div>
  <!-- CATEGORIES -->

  <h2 class="category-title">
    Explore Categories
  </h2>


  <div class="categories">

    <button onclick="loadBooks('fiction')">
      📖 Fiction
    </button>

    <button onclick="loadBooks('mystery')">
      🕵️ Mystery
    </button>

    <button onclick="loadBooks('horror')">
      👻 Horror
    </button>

    <button onclick="loadBooks('romance')">
      💕 Romance
    </button>

    <button onclick="loadBooks('fantasy')">
      🧙 Fantasy
    </button>

    <button onclick="loadBooks('science')">
      🔬 Science
    </button>

    <button onclick="loadBooks('technology')">
      💻 Technology
    </button>

    <button onclick="loadBooks('mathematics')">
      ➗ Mathematics
    </button>

    <button onclick="loadBooks('psychology')">
      🧠 Psychology
    </button>

    <button onclick="loadBooks('self help')">
      🌱 Self-Help
    </button>

    <button onclick="loadBooks('history')">
      🏛️ History
    </button>

    <button onclick="loadBooks('geography')">
      🌍 Geography
    </button>

    <button onclick="loadBooks('drama')">
      🎭 Drama
    </button>

    <button onclick="loadBooks('poetry')">
      ✍️ Poetry
    </button>

    <button onclick="loadBooks('children')">
      🧒 Children
    </button>

    <button onclick="loadBooks('adventure')">
      🗺️ Adventure
    </button>

    <button onclick="loadBooks('philosophy')">
      🕊️ Philosophy
    </button>

    <button onclick="loadBooks('economics')">
      💰 Economics
    </button>

    <button onclick="loadBooks('law')">
      ⚖️ Law
    </button>

    <button onclick="loadBooks('education')">
      🎓 Education
    </button>

  </div>


  <!-- MESSAGE -->

  <p id="message">
    Loading books...
  </p>


  <!-- BOOK CONTAINER -->

  <div id="bookContainer"></div>


  <!-- READER -->

  <div id="reader">

    <div class="reader-header">

      <h2 id="readerTitle">
        Reading Book
      </h2>

      <button onclick="closeReader()">
        Close ✖
      </button>

    </div>

    <iframe
      id="readerFrame"
      title="Book Reader">
    </iframe>

  </div>


  <script>

    const container =
      document.getElementById("bookContainer");

    const message =
      document.getElementById("message");


    /* SEARCH */

    async function loadBooks(query = "adventures") {

    message.textContent = "Loading books...";
    container.innerHTML = "";

    try {

        const response = await fetch(
            "https://gutendex.com/books/?search=" + encodeURIComponent(query)
        );

        if (!response.ok) {
            throw new Error("API Error");
        }

        const data = await response.json();
        const books = data.results.slice(0, 20);

        if (books.length === 0) {
            message.textContent = "📚 Is category mein books nahi mili.";
            return;
        }

        message.textContent = books.length + " books found";

        books.forEach(book => {

            const cover = book.formats["image/jpeg"];

            const htmlUrl =
                book.formats["text/html"] ||
                book.formats["text/html; charset=utf-8"];

            const card = document.createElement("div");
            card.className = "book-card";

            const img = document.createElement("img");
            img.src = cover || "https://placehold.co/145x210?text=No+Cover";
            img.alt = book.title + " cover";

            const title = document.createElement("h3");
            title.textContent = book.title;

            const author = document.createElement("p");

            author.textContent =
                book.authors.length
                    ? book.authors.map(a => a.name).join(", ")
                    : "Unknown Author";

            card.appendChild(img);
            card.appendChild(title);
            card.appendChild(author);
            const detailsButton = document.createElement("button");

detailsButton.className = "details-btn";
detailsButton.textContent = "ℹ️ Details";

detailsButton.onclick = function () {
    alert(
        "📚 Title: " + book.title +
        "\n✍️ Author: " +
        (book.authors.length
            ? book.authors.map(a => a.name).join(", ")
            : "Unknown") +
        "\n🌐 Language: " +
        (book.languages && book.languages.length
            ? book.languages.join(", ")
            : "Unknown") +
        "\n👀 Downloads: " +
        (book.download_count || "Not available")
    );
};

card.appendChild(detailsButton);

            if (htmlUrl) {

                const readButton = document.createElement("button");

                readButton.className = "read-btn";
                readButton.textContent = "📖 Read Online";

                readButton.onclick = function () {
                    openReader(book.title, htmlUrl);
                };

                card.appendChild(readButton);

            } else {

                const note = document.createElement("p");
                note.textContent = "Online reading unavailable";

                card.appendChild(note);
            }

            container.appendChild(card);
        });

    } catch (error) {

        console.log(error);

        message.textContent =
            "⚠️ Cannot load books!! check your connections";

    }
}


    /* LOAD BOOKS */

    async function loadBooks(query = "adventures") {

      message.textContent =
        "Loading books...";

      container.innerHTML = "";


      try {

        const response = await fetch(
          "https://gutendex.com/books/?search="
          + encodeURIComponent(query)
        );


        if (!response.ok) {

          throw new Error(
            "Could not load books"
          );

        }


        const data =
          await response.json();


        const books =
          data.results.slice(0, 20);


        if (books.length === 0) {

          message.textContent =
            "No books found. Try another search.";

          return;
        }


        message.textContent =
          books.length + " books found";


        books.forEach(book => {

          const cover =
            book.formats["image/jpeg"];


          const htmlUrl =
            book.formats["text/html"] ||
            book.formats["text/html; charset=utf-8"];


          const card =
            document.createElement("div");

          card.className =
            "book-card";


          const img =
            document.createElement("img");

          img.src =
            cover ||
            "https://placehold.co/145x210?text=No+Cover";

          img.alt =
            book.title + " cover";


          const title =
            document.createElement("h3");

          title.textContent =
            book.title;


          const author =
            document.createElement("p");

          author.textContent =
            book.authors.length
            ? book.authors.map(a => a.name).join(", ")
            : "Unknown Author";


          card.appendChild(img);

          card.appendChild(title);

          card.appendChild(author);


          if (htmlUrl) {

            const readButton =
              document.createElement("button");

            readButton.className =
              "read-btn";

            readButton.textContent =
              "📖 Read Online";


            readButton.onclick = () =>
              openReader(
                book.title,
                htmlUrl
              );


            card.appendChild(readButton);

          } else {

            const note =
              document.createElement("p");

            note.textContent =
              "Online reading unavailable";

            card.appendChild(note);

          }


          container.appendChild(card);

        });


      } catch (error) {

        message.textContent =
          "Books load nahi hui. Internet connection check karo.";

      }

    }


    /* OPEN READER */

    function openReader(title, url) {

      document.getElementById(
        "readerTitle"
      ).textContent = title;


      document.getElementById(
        "readerFrame"
      ).src = url;


      document.getElementById(
        "reader"
      ).style.display = "flex";

    }


    /* CLOSE READER */

    function closeReader() {

      document.getElementById(
        "reader"
      ).style.display = "none";


      document.getElementById(
        "readerFrame"
      ).src = "";

    }


    /* ENTER KEY SEARCH */

    document.getElementById(
      "searchInput"
    ).addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          searchBooks();

        }

      }
    );


    /* FIRST LOAD */
    console.log("API test starting");
    loadBooks();
    console.log("JavaScript is working");

  </script>
<footer>
    <p>📚 Virtual Library © 2026</p>
    <p>Read • Learn • Explore</p>
</footer>
</body>

</html>
